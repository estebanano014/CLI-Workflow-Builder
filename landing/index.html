<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLI Workflow Builder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111827;
        --surface: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #3b82f6;
        --border: #374151;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 40px 32px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
      }
      a:hover {
        filter: brightness(1.1);
      }
      .nota {
        margin: 24px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CLI Workflow Builder</h1>
      <p>Tu referencia rápida de comandos de consola y flujos, sin conexión.</p>
      <a href="cliwf://abrir">Abrir la aplicación</a>
      <p class="nota">
        Requiere tener instalada la app de escritorio en este equipo. Si no se abre, instálala
        primero.
      </p>
    </main>
  </body>
</html>

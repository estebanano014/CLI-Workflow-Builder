appId: com.cliwf.builder
productName: CLI Workflow Builder
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: python-core
    to: python-core
  - from: vendor/python
    to: python
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
asar: true
